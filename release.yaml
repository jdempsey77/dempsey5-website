# release.yaml: the release contract (v1). Schema: _reorg/repo_contract_audit.md.
contract: 1
tier: 1
branch: main
test: "node --check script.js && /usr/bin/python3 tests/check_site.py && /usr/bin/python3 -m unittest discover -s tests -q"   # = tests.yml (stdlib + node, no network)
ci: true   # tests.yml on ubuntu-latest, PRs + main
secrets: none   # OpenWeatherMap key in script.js is client-side by design (see CLAUDE.md)
deploy:
  target: github-pages
  how: on-merge   # the merge is the deploy: Pages (legacy build from main) publishes; /deploy waits, smokes, records
  environment: github-pages   # confirmed 2026-10-21: Pages deployments of main land in this env and reach success
  path: https://dempsey5.com   # informational (the site URL)
  order: 70
  ledger: deploy
  note: "GitHub Pages classic (legacy build from main /): push to main publishes dempsey5.com"
smoke:
  command: "curl -fsS -m 10 -o /dev/null https://dempsey5.com"   # public, from anywhere
  tries: 3
rollback: hand   # a revert PR through /merge; Pages republishes, then /deploy records it
