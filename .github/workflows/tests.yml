name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check script.js
        run: node --check script.js
      - name: Check the site (HTML well-formed, internal links resolve)
        run: python tests/check_site.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
